<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }} | Daud Sibanda</title>
  <meta name="description" content="{{ post.excerpt }}">
  <meta name="theme-color" content="#f6f2ee">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f2ea;
      --ink: #141414;
      --muted: #4f4f4f;
      --surface-2: rgba(255, 255, 255, 0.82);
      --line: rgba(20, 20, 20, 0.12);
      --accent: #ef7b2d;
      --accent-2: #1f6f5c;
      --card: #ffffff;
      --shadow: 0 12px 30px rgba(10, 10, 10, 0.08);
      --radius: 22px;
      --grid: rgba(20, 20, 20, 0.06);
    }

    [data-theme="dark"] {
      --bg: #0B0F17;
      --ink: #f5f5f5;
      --muted: #c7c7c7;
      --surface-2: rgba(30, 41, 59, 0.85);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #F97316;
      --accent-2: #10B981;
      --card: rgba(30, 41, 59, 0.85);
      --shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      --grid: rgba(255, 255, 255, 0.06);
    }

    body {
      background:
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(180deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
        radial-gradient(900px 500px at 8% -10%, rgba(239, 123, 45, 0.16) 0%, transparent 60%),
        radial-gradient(900px 520px at 95% 0%, rgba(31, 111, 92, 0.16) 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", "Space Grotesk", sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    h1, h2, h3, .navbar-brand {
      font-family: "Outfit", "Fraunces", serif;
    }

    .navbar {
      backdrop-filter: blur(14px);
      background: rgba(12, 12, 12, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .article-shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 120px 20px 80px;
    }

    .article-card {
      background: var(--surface-2);
      backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(24px, 4vw, 48px);
      box-shadow: var(--shadow);
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.06rem;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-block;
      background: rgba(31, 111, 92, 0.12);
      color: var(--accent-2);
      border: 1px solid rgba(31, 111, 92, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .content {
      line-height: 1.8;
      font-size: 1.06rem;
      white-space: pre-wrap;
      color: var(--ink);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Daud Sibanda</a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/#blog" class="btn btn-outline-light btn-sm">All Notes</a>
        <button id="theme-toggle" class="btn btn-outline-light btn-sm" type="button">Theme</button>
      </div>
    </div>
  </nav>

  <main class="article-shell">
    <div class="mb-4">
      <a href="/#blog" class="btn-back">&larr; Back to Writing</a>
    </div>
    <article class="article-card">
      <div class="meta">
        {% if post.published_at %}Published {{ post.published_at }}{% else %}Case Note{% endif %}
      </div>
      <h1 class="display-6 fw-bold mb-3">{{ post.title }}</h1>
      {% if post.tags %}
      <div class="mb-4">
        {% for tag in post.tags %}
          <span class="pill">{{ tag }}</span>
        {% endfor %}
      </div>
      {% endif %}
      <hr class="my-4" style="border-color: var(--line);">
      <div class="content">{{ post.content or post.excerpt }}</div>
    </article>
  </main>

  <script>
    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === "dark") {
        root.setAttribute("data-theme", "dark");
      } else {
        root.removeAttribute("data-theme");
      }
      localStorage.setItem("theme", theme);
      const toggle = document.getElementById("theme-toggle");
      if (toggle) toggle.textContent = theme === "dark" ? "Light" : "Dark";
    }
    document.addEventListener("DOMContentLoaded", () => {
      applyTheme(localStorage.getItem("theme") || "light");
      const toggle = document.getElementById("theme-toggle");
      if (toggle) {
        toggle.addEventListener("click", () => {
          const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          applyTheme(next);
        });
      }
    });
  </script>
</body>
</html>
