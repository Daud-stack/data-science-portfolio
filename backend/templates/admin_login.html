<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Portfolio Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", sans-serif;
      background: radial-gradient(800px 450px at 50% 0%, rgba(56, 189, 248, 0.14), transparent 60%), #0B0F17;
      color: #F8FAFC;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
    }
    h2 { font-family: "Outfit", sans-serif; margin-top: 0; margin-bottom: 18px; }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      width: min(360px, calc(100% - 32px));
    }
    label { display: block; font-weight: 600; font-size: 0.88rem; color: #94A3B8; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.85);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      margin-bottom: 16px;
      font-family: "Inter", sans-serif;
    }
    input:focus { outline: 2px solid #38BDF8; border-color: transparent; }
    button {
      background: #F97316;
      color: #fff;
      border: 0;
      padding: 11px 16px;
      border-radius: 8px;
      width: 100%;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4); }
    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h2>Admin Login</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required>
    <button type="submit">Sign In</button>
  </form>
</body>
</html>
